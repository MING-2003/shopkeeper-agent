# LLM 配置
# 2026-10-01 修改：原配置指向硅基流动(api.siliconflow.cn)，但本项目实际使用的是
# 阿里云百炼的 API Key，导致调用时返回 401 "Token is invalid"。
# 因此将 base_url 切换为百炼的 OpenAI 兼容端点(dashscope.aliyuncs.com/compatible-mode/v1)，
# 并将模型从硅基流动的 Pro/zai-org/GLM-5.1 换成百炼上的 qwen-plus。
# 如需更换模型(如 qwen-max、deepseek-v3)，只改 model_name 即可，前提是百炼账号已开通该模型。
llm:
  model_name: qwen-plus
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
