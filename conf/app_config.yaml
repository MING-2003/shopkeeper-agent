logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 2026-10-26 修改：宿主机 3306 被本机 MySQL 服务、9200 被 cpolar 占用，
# Docker 容器端口改为映射到 3307/9201（见 docker/docker-compose.yaml），此处同步修改
db_meta:
  host: localhost
  port: 3307
  user: didilili
  password: dili123
  database: meta

# 2026-11-05 修改：数仓账号切换为只读账号 dw_ro（SQL 安全四道防线的最后一道），
# 即使上层防护被击穿，数据库层面也无法写入。账号由 docker/mysql/02-init-readonly-user.sql 创建；
# 已有 mysql_data 卷的环境 initdb.d 不会自动执行新脚本，需手动补执行一次
db_dw:
  host: localhost
  port: 3307
  user: dw_ro
  password: dw_ro_pass
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9201
  index_name: data_agent

# Redis 配置（分层缓存）
# 宿主机 6379 被 dovideo-ai 项目的 Redis 容器占用，Docker 映射到 6380（见 docker/docker-compose.yaml）
redis:
  host: localhost
  port: 6380

# LLM 配置
# 2026-10-01 修改：原配置指向硅基流动(api.siliconflow.cn)，但本项目实际使用的是
# 阿里云百炼的 API Key，导致调用时返回 401 "Token is invalid"。
# 因此将 base_url 切换为百炼的 OpenAI 兼容端点(dashscope.aliyuncs.com/compatible-mode/v1)，
# 并将模型从硅基流动的 Pro/zai-org/GLM-5.1 换成百炼上的 qwen-plus。
# 2026-10-30 修改：qwen-plus 是付费模型，额度已用尽；切换到百炼"免费额度"页内的
# qwen3.7-plus（免费 1M tokens，有效期至 2026-11-28）。
# 如需再换模型，只改 model_name 为百炼"模型 Code"即可（免费额度页可见各模型余量）。
llm:
  model_name: qwen3.7-plus
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
